name: Packfleet
description: 'Packfleet was an all-electric last-mile parcel courier based in London, delivering for
  hundreds of merchant customers using a zero-emission electric-van fleet with a focus on sustainable,
  reliable next-day delivery. Backed by Creandum as a venture-funded climate-logistics company, Packfleet
  wound down its independent brand in March 2025, with its deliveries transitioned to DHL. No public
  developer API, documentation, or developer portal was ever published; this profile is retained as a
  network record. Enriched: no API surface (company now operates as DHL).'
